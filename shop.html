<style>
  .shop-hero { border-bottom: 1px solid var(--color-rule); }
  .shop-hero canvas { display: block; width: 100%; height: auto; cursor: pointer; }
  .shop-game-wrap { overflow: hidden; border-bottom: 1px solid var(--color-rule); transition: height 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
  .shop-hero-foot { padding: var(--s2) var(--margin); display: flex; justify-content: flex-end; }
</style>
<div class="shop-hero">

  </div>

    <p class="hero-sub">LIMITED EDITIONS<br>PRINTS &amp; OBJECTS</p>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById('shop-game');
  var wrap   = document.getElementById('shop-game-wrap');
  var ctx    = canvas.getContext('2d');

  var W = 800, H = 220, GROUND = 182, FIG_X = 80;
  var IDLE_H = 168, IDLE_GROUND = 148; // logical canvas coords for idle/header state
  var dpr = window.devicePixelRatio || 1;
  var expanded = false;

  function idleCssH(cssW) { return Math.round(cssW * IDLE_H / W); }
  function fullCssH(cssW) { return Math.round(cssW * H / W); }

  function resizeCanvas() {
    var cssW = canvas.clientWidth || W;
    var fH = fullCssH(cssW);
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(fH * dpr);
    ctx.setTransform(cssW / W * dpr, 0, 0, fH / H * dpr, 0, 0);
    wrap.style.transition = 'none';
    wrap.style.height = (expanded ? fH : idleCssH(cssW)) + 'px';
    requestAnimationFrame(function() { wrap.style.transition = ''; });
  }

  function expandCanvas() {
    if (expanded) return;
    expanded = true;
    var cssW = canvas.clientWidth || W;
    wrap.style.height = fullCssH(cssW) + 'px';
  }

  function collapseCanvas() {
    if (!expanded) return;
    expanded = false;
    var cssW = canvas.clientWidth || W;
    wrap.style.height = idleCssH(cssW) + 'px';
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  var GRAVITY = 0.55, JUMP_FORCE = -13.5, BASE_SPEED = 4.5;

  var INK = '#0A0A0A', PAPER = '#F5F5F0', MID = '#8A8A85', ACCENT = '#D4321C';

  var figY = GROUND, figVY = 0, jumping = false, frame = 0;
  var state = 'idle'; // 'idle' | 'playing' | 'dead'
  var score = 0, hiScore = 0;
  var deadTimer = 0;

  var obstacles = [], spawnTimer = 0, spawnInterval = 90, letterIdx = 0;
  var LETTERS = ['S','H','O','P'];
  var OBS_SIZE = 70;
  var OBS_FONT  = '700 ' + OBS_SIZE + 'px \'Helvetica Neue\', Helvetica, Arial, sans-serif';
  var MONO_FONT = '700 11px \'Courier New\', monospace';

  function letterW(l) {
    ctx.font = OBS_FONT;
    return ctx.measureText(l).width;
  }

  function reset() {
    figY = GROUND; figVY = 0; jumping = false; frame = 0;
    obstacles = []; spawnTimer = 0; spawnInterval = 90; letterIdx = 0; score = 0;
  }

  function doJump() {
    if (!jumping) { figVY = JUMP_FORCE; jumping = true; }
  }

  function handleInput() {
    if      (state === 'idle')    { reset(); state = 'playing'; expandCanvas(); doJump(); }
    else if (state === 'playing') { doJump(); }
    else if (state === 'dead')    { reset(); state = 'playing'; }
  }

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); handleInput(); }
  });
  canvas.addEventListener('click', handleInput);
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handleInput(); }, { passive: false });

  function drawFigure(x, footY, t, dead) {
    var HEAD_R   = 7;
    var headCY   = footY - 43;
    var neck     = footY - 35;
    var shoulder = footY - 31;
    var waist    = footY - 23;
    var crotch   = footY - 13;
    var THIGH = 8, SHIN = 6;

    ctx.save();
    ctx.strokeStyle = dead ? ACCENT : INK;
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';

    // Head — solid filled
    ctx.beginPath(); ctx.arc(x, headCY, HEAD_R, 0, Math.PI * 2);
    ctx.fillStyle = dead ? ACCENT : INK; ctx.fill();
    // Spine
    ctx.beginPath(); ctx.moveTo(x, neck); ctx.lineTo(x, crotch); ctx.stroke();

    if (state === 'idle') {
      // Waving arm pose
      var wave = Math.sin(t * 0.07) * 4;
      // Right arm raised — waving
      ctx.beginPath(); ctx.moveTo(x, shoulder); ctx.lineTo(x + 10, shoulder - 10 + wave); ctx.stroke();
      // Left arm relaxed down
      ctx.beginPath(); ctx.moveTo(x, shoulder); ctx.lineTo(x - 8, waist + 2); ctx.stroke();
      // Legs in light stride
      ctx.beginPath(); ctx.moveTo(x, crotch); ctx.lineTo(x - 6, crotch + 8); ctx.lineTo(x - 4, footY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, crotch); ctx.lineTo(x + 5, crotch + 7); ctx.lineTo(x + 3, footY); ctx.stroke();
    } else if (jumping) {
      // Arms raised
      ctx.beginPath(); ctx.moveTo(x, shoulder); ctx.lineTo(x - 9, shoulder - 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, shoulder); ctx.lineTo(x + 9, shoulder - 8); ctx.stroke();
      // Legs tucked
      ctx.beginPath(); ctx.moveTo(x, crotch); ctx.lineTo(x - 6, crotch + 8); ctx.lineTo(x - 4, footY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, crotch); ctx.lineTo(x + 6, crotch + 8); ctx.lineTo(x + 4, footY); ctx.stroke();
    } else {
      // Running arms
      var swing = Math.sin(t * 0.22) * 0.5;
      ctx.beginPath(); ctx.moveTo(x, shoulder); ctx.lineTo(x + swing * 9, waist + 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, shoulder); ctx.lineTo(x - swing * 9, waist + 7); ctx.stroke();
      // Running legs
      var lKX = x - Math.sin(swing) * THIGH, lKY = crotch + Math.cos(swing) * THIGH;
      ctx.beginPath(); ctx.moveTo(x, crotch); ctx.lineTo(lKX, lKY); ctx.lineTo(lKX - Math.sin(swing * 0.5) * SHIN, footY); ctx.stroke();
      var rKX = x + Math.sin(swing) * THIGH, rKY = crotch + Math.cos(swing) * THIGH;
      ctx.beginPath(); ctx.moveTo(x, crotch); ctx.lineTo(rKX, rKY); ctx.lineTo(rKX + Math.sin(swing * 0.5) * SHIN, footY); ctx.stroke();
    }
    ctx.restore();
  }

  function collides(o) {
    var figL = FIG_X - 6, figR = FIG_X + 6, figB = figY;
    var obsL = o.x + 4, obsR = o.x + o.w - 4;
    var obsT = GROUND - OBS_SIZE * 0.73;
    return figR > obsL && figL < obsR && figB > obsT;
  }

  function loop() {
    frame++;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);

    if (state === 'idle') {
      // Ground line at idle level
      ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, IDLE_GROUND); ctx.lineTo(W, IDLE_GROUND); ctx.stroke();

      // Large display heading sitting on the idle floor
      var DISPLAY_FONT = '700 90px \'Helvetica Neue\', Helvetica, Arial, sans-serif';
      ctx.font = DISPLAY_FONT; ctx.textBaseline = 'alphabetic';
      var shopW = ctx.measureText('SHOP').width;
      var dotW  = ctx.measureText('.').width;
      var titleX = 40;
      ctx.fillStyle = INK;    ctx.fillText('SHOP', titleX, IDLE_GROUND);
      ctx.fillStyle = ACCENT; ctx.fillText('.', titleX + shopW, IDLE_GROUND);

      var IDLE_FIG_X = titleX + shopW + dotW + 30;
      drawFigure(IDLE_FIG_X, IDLE_GROUND, frame, false);

      // Hint — right side of canvas
      ctx.font = '400 10px \'IBM Plex Mono\', \'Courier New\', monospace';
      ctx.fillStyle = '#C8C8C2';
      ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('SPACE / CLICK —', W - 40, IDLE_GROUND - 10);
      ctx.textAlign = 'left';

    } else if (state === 'playing') {
      ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

      figVY += GRAVITY; figY += figVY;
      if (figY >= GROUND) { figY = GROUND; figVY = 0; jumping = false; }

      spawnTimer++;
      if (spawnTimer >= spawnInterval) {
        var l = LETTERS[letterIdx % 4]; letterIdx++;
        obstacles.push({ letter: l, x: W + 20, w: letterW(l), passed: false });
        spawnTimer = 0;
        spawnInterval = Math.max(52, 90 - Math.floor(score / 3) * 6);
      }

      var speed = BASE_SPEED + Math.min(score * 0.05, 2.5);
      for (var i = 0; i < obstacles.length; i++) {
        obstacles[i].x -= speed;
        if (!obstacles[i].passed && obstacles[i].x + obstacles[i].w < FIG_X - 10) {
          obstacles[i].passed = true; score++;
        }
      }
      for (var j = 0; j < obstacles.length; j++) {
        if (collides(obstacles[j])) {
          if (score > hiScore) hiScore = score;
          state = 'dead'; jumping = false; deadTimer = Date.now(); break;
        }
      }
      obstacles = obstacles.filter(function(o) { return o.x > -200; });

      ctx.font = OBS_FONT; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = ACCENT;
      for (var k = 0; k < obstacles.length; k++) ctx.fillText(obstacles[k].letter, obstacles[k].x, GROUND);

      drawFigure(FIG_X, figY, frame, false);

      ctx.font = MONO_FONT; ctx.fillStyle = MID;
      ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('' + score, W - 14, 20);
      ctx.textAlign = 'left';

    } else {
      if (Date.now() - deadTimer > 5000) { reset(); state = 'idle'; collapseCanvas(); }

      ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

      ctx.font = OBS_FONT; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = ACCENT;
      for (var m = 0; m < obstacles.length; m++) ctx.fillText(obstacles[m].letter, obstacles[m].x, GROUND);

      drawFigure(FIG_X, GROUND, frame, true);

      ctx.font = MONO_FONT; ctx.fillStyle = INK;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('SCORE ' + score + '  \xB7  HI ' + hiScore, W / 2, GROUND - 88);
      ctx.font = '400 10px \'IBM Plex Mono\', \'Courier New\', monospace';
      ctx.fillStyle = '#C8C8C2';
      ctx.fillText('PRESS SPACE OR CLICK TO RETRY', W / 2, GROUND + 26);
      ctx.textAlign = 'left';
    }

    requestAnimationFrame(loop);
  }

  loop();
})();
</script>

<script>
/* ─────────────────────────────────────────────────────────────────
   SHOP DATA
   To add a product: add a new object to this array.
   stripeLink: paste your Stripe Payment Link URL here.
                Leave "" to redirect to the inquiry form instead.
   type: "digital" | "physical" | "workshop"
   img: path to product image, e.g. "media/shop/print-01.jpg"
        Leave "" to use the colour placeholder.
───────────────────────────────────────────────────────────────── */
var PRODUCTS = [
  {
    title:      '6:00PM on a Saturday Night (04/02/2004) - acrylic painting on wood',
    edition:    '',
    type:       'physical',
    price:      700,
    currency:   '€',
    color:      '#f15bb5',
    img:        'media/fridaynight (1).jpeg',
    desc:       '',
    available:  true,
    stripeLink: '',
    link:       'shop/saturday-night.html'
  }
];

var grid = document.getElementById('shop-grid');

PRODUCTS.forEach(function(p) {
  var card = document.createElement('div');
  card.className = 'product-card';

  /* Thumb */
  var thumb = document.createElement('div');
  thumb.className = 'product-thumb';
  if (p.img) {
    var img = document.createElement('img');
    img.src = p.img; img.alt = p.title;
    thumb.appendChild(img);
  } else {
    thumb.style.background = p.color;
    var inner = document.createElement('div');
    inner.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;';
    var lbl = document.createElement('span');
    lbl.style.cssText = 'font-family:"IBM Plex Mono","Courier New",monospace;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.18);text-align:center;padding:0 16px;';
    lbl.textContent = p.title;
    inner.appendChild(lbl);
    thumb.appendChild(inner);
    thumb.style.position = 'relative';
  }

  /* Price tag overlaid on image */
  var priceTag = document.createElement('div');
  priceTag.className   = 'product-price-tag';
  priceTag.textContent = p.available ? (p.currency + p.price.toLocaleString()) : 'SOLD';
  thumb.appendChild(priceTag);

  /* Meta */
  var meta = document.createElement('div');
  meta.className = 'product-meta';

  var edition = document.createElement('span');
  edition.className = 'product-edition';
  edition.innerHTML = p.edition +
    (!p.available ? ' — <span class="sold">SOLD OUT</span>' : '');

  var title = document.createElement('div');
  title.className   = 'product-title';
  title.textContent = p.title;

  var desc = document.createElement('p');
  desc.className   = 'product-desc';
  desc.textContent = p.desc;

  var btn = document.createElement('button');
  btn.className = 'btn-acquire' + (p.available ? '' : ' sold');
  btn.disabled  = !p.available;
  btn.innerHTML = p.available ? 'Purchase &rarr;' : 'Sold Out';

  if (p.available) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (p.stripeLink) {
        window.open(p.stripeLink, '_blank');
      } else {
        window.location.href = 'inquiry.html';
      }
    });
  }

  if (p.link) {
    card.addEventListener('click', function() { window.location.href = p.link; });
  }

  meta.appendChild(edition);
  meta.appendChild(title);
  meta.appendChild(desc);
  meta.appendChild(btn);

  card.appendChild(thumb);
  card.appendChild(meta);
  grid.appendChild(card);
});

document.getElementById('burger').addEventListener('click', function() {
  document.getElementById('nav-overlay').classList.add('open');
});
document.getElementById('nav-close').addEventListener('click', function() {
  document.getElementById('nav-overlay').classList.remove('open');
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') document.getElementById('nav-overlay').classList.remove('open');
});
</script>

<!-- LEGO CURSOR -->
<style>* { cursor: none !important; }</style>
<script>
(function () {
  var COLORS = ['#e63946','#ff6b35','#ffd166','#06d6a0','#118ab2','#9b5de5','#f15bb5','#00bbf9'];
  var SHAPES  = [[1,1],[2,1],[2,2],[4,1],[4,2],[3,1],[2,3],[1,4]];
  var brickIdx=0, colorIdx=0, animScale=1, animId=null, mx=-300, my=-300, currentZone=null;
  var dpr = window.devicePixelRatio || 1;
  var el = document.createElement('canvas');
  el.style.cssText = 'position:fixed;top:-300px;left:-300px;pointer-events:none;z-index:9999;transition:opacity .15s;';
  document.body.appendChild(el);
  function ph(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function rs(r,g,b){return'rgb('+r+','+g+','+b+')';}
  function lighten(h,f){var c=ph(h);return rs(~~Math.min(255,c[0]+(255-c[0])*f),~~Math.min(255,c[1]+(255-c[1])*f),~~Math.min(255,c[2]+(255-c[2])*f));}
  function darken(h,f){var c=ph(h);return rs(~~(c[0]*(1-f)),~~(c[1]*(1-f)),~~(c[2]*(1-f)));}
  function draw(){
    var cols=SHAPES[brickIdx][0],rows=SHAPES[brickIdx][1],hex=COLORS[colorIdx],sc=animScale;
    var u=11,bh=8,sH=4,pad=4,sRx=u*0.30,sRy=sRx*0.55;
    var cW=(cols+rows)*u+pad*2, cH=(cols+rows)*u*0.5+bh+sH+pad*2;
    el.width=Math.ceil(cW*sc*dpr); el.height=Math.ceil(cH*sc*dpr);
    el.style.width=Math.ceil(cW*sc)+'px'; el.style.height=Math.ceil(cH*sc)+'px';
    var ctx=el.getContext('2d'); ctx.clearRect(0,0,el.width,el.height); ctx.save(); ctx.scale(sc*dpr,sc*dpr);
    var ox=rows*u+pad, oy=sH+pad;
    function iX(c,r){return ox+(c-r)*u;} function iY(c,r){return oy+(c+r)*u*0.5;}
    var cT=lighten(hex,0.30),cB=hex,cD=darken(hex,0.32),cST=lighten(hex,0.55);
    ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(iX(0,rows),iY(0,rows));ctx.lineTo(iX(0,rows),iY(0,rows)+bh);ctx.lineTo(iX(cols,rows),iY(cols,rows)+bh);ctx.lineTo(iX(cols,rows),iY(cols,rows));ctx.closePath();
    ctx.fillStyle=cD;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=0.6;ctx.stroke();
    ctx.beginPath();ctx.moveTo(iX(cols,0),iY(cols,0));ctx.lineTo(iX(cols,0),iY(cols,0)+bh);ctx.lineTo(iX(cols,rows),iY(cols,rows)+bh);ctx.lineTo(iX(cols,rows),iY(cols,rows));ctx.closePath();
    ctx.fillStyle=cB;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=0.6;ctx.stroke();
    ctx.beginPath();ctx.moveTo(iX(0,0),iY(0,0));ctx.lineTo(iX(cols,0),iY(cols,0));ctx.lineTo(iX(cols,rows),iY(cols,rows));ctx.lineTo(iX(0,rows),iY(0,rows));ctx.closePath();
    ctx.fillStyle=cT;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=0.6;ctx.stroke();
    for(var d=0;d<cols+rows;d++){for(var c2=0;c2<cols;c2++){var r2=d-c2;if(r2<0||r2>=rows)continue;
      var sx=iX(c2+0.5,r2+0.5),sy=iY(c2+0.5,r2+0.5);
      ctx.beginPath();ctx.moveTo(sx-sRx,sy);ctx.lineTo(sx-sRx,sy-sH);ctx.ellipse(sx,sy-sH,sRx,sRy,0,Math.PI,0,true);ctx.lineTo(sx+sRx,sy);ctx.ellipse(sx,sy,sRx,sRy,0,0,Math.PI,false);ctx.closePath();
      ctx.fillStyle=cT;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=0.4;ctx.stroke();
      ctx.beginPath();ctx.ellipse(sx,sy-sH,sRx,sRy,0,0,Math.PI*2);ctx.fillStyle=cST;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=0.4;ctx.stroke();
    }}
    ctx.restore();
    el.style.left=(mx-ox*sc)+'px'; el.style.top=(my-oy*sc)+'px';
  }
  function popAnim(){if(animId)cancelAnimationFrame(animId);var t0=performance.now();(function pop(){var t=Math.min(1,(performance.now()-t0)/260);animScale=1+0.45*Math.pow(1-t,2);draw();if(t<1){animId=requestAnimationFrame(pop);}else{animScale=1;animId=null;}})();}
  function getZone(target){return target.closest&&(target.closest('.work-card')||target.closest('.work-list-row')||target.closest('.product-card')||target.closest('.project-hero')||target.closest('.project-meta')||target.closest('.project-description')||target.closest('.media-full')||target.closest('.media-half')||target.closest('.project-nav-item')||target.closest('.about-left')||target.closest('.about-right')||target.closest('.inquiry-info')||target.closest('.inquiry-form-wrap')||target.closest('.thanks-wrap')||target.closest('.hero-band')||target.closest('.shop-notice')||target.closest('#nav')||target.closest('.view-toggle')||target.closest('footer'))||null;}
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;el.style.opacity='1';draw();});
  document.addEventListener('mouseover',function(e){var zone=getZone(e.target);if(zone&&zone!==currentZone){currentZone=zone;brickIdx=(brickIdx+1)%SHAPES.length;colorIdx=(colorIdx+1)%COLORS.length;popAnim();}});
  document.addEventListener('mouseleave',function(){el.style.opacity='0';});
  document.addEventListener('mouseenter',function(){el.style.opacity='1';});
  draw();
})();
</script>
</body>
